<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">Closet Bundle Box</title>
  <desc id="desc">A starry gift crate holding folded tops, with a small planet and a gold monogram.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070814"/>
      <stop offset="55%" stop-color="#12152c"/>
      <stop offset="100%" stop-color="#1c1630"/>
    </linearGradient>
    <linearGradient id="crate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2540"/>
      <stop offset="100%" stop-color="#161326"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d48a"/>
      <stop offset="100%" stop-color="#c9a44a"/>
    </linearGradient>
    <radialGradient id="planet" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#9ad7e0"/>
      <stop offset="55%" stop-color="#3d7ea8"/>
      <stop offset="100%" stop-color="#1a3a58"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1000" fill="url(#sky)"/>
  <g fill="#e8eefc">
    <circle cx="80" cy="70" r="1.6"/><circle cx="160" cy="140" r="1.2"/><circle cx="240" cy="50" r="1.8"/>
    <circle cx="330" cy="110" r="1"/><circle cx="420" cy="40" r="1.4"/><circle cx="510" cy="90" r="1.1"/>
    <circle cx="620" cy="35" r="1.5"/><circle cx="710" cy="120" r="1.2"/><circle cx="800" cy="60" r="1.7"/>
    <circle cx="890" cy="150" r="1"/><circle cx="980" cy="45" r="1.3"/><circle cx="1070" cy="100" r="1.6"/>
    <circle cx="140" cy="250" r="1"/><circle cx="980" cy="230" r="1.2"/><circle cx="60" cy="400" r="1.1"/>
    <circle cx="1140" cy="360" r="1.4"/><circle cx="200" cy="880" r="1.2"/><circle cx="1050" cy="820" r="1.5"/>
  </g>
  <ellipse cx="600" cy="820" rx="340" ry="36" fill="#000" opacity=".35"/>
  <circle cx="960" cy="210" r="86" fill="url(#planet)"/>
  <ellipse cx="930" cy="190" rx="28" ry="14" fill="#d9f3f8" opacity=".25"/>
  <ellipse cx="960" cy="210" rx="94" ry="16" fill="none" stroke="#f0d48a" stroke-width="2" opacity=".55" transform="rotate(-18 960 210)"/>
  <!-- crate -->
  <g transform="translate(250,260)">
    <path d="M40 220 L350 160 L660 220 L350 300 Z" fill="#3a3458"/>
    <path d="M40 220 L40 470 L350 560 L350 300 Z" fill="url(#crate)"/>
    <path d="M350 300 L350 560 L660 470 L660 220 Z" fill="#241e38"/>
    <path d="M40 220 L350 160 L660 220 L350 300 Z" fill="none" stroke="url(#gold)" stroke-width="6"/>
    <path d="M350 300 L350 560" stroke="#c9a44a" stroke-width="5"/>
    <path d="M40 220 L40 470 L350 560 L660 470 L660 220" fill="none" stroke="#c9a44a" stroke-width="4"/>
    <!-- folded tops peeking out -->
    <path d="M200 210 L280 190 L430 230 L360 265 Z" fill="#7aa0c8"/>
    <path d="M260 200 L340 175 L490 220 L410 255 Z" fill="#c97878"/>
    <path d="M320 188 L410 162 L560 215 L470 250 Z" fill="#d6c49a"/>
    <path d="M290 205 L455 155 L520 200 L360 250 Z" fill="#6e8f6e"/>
    <path d="M240 215 L400 170 L470 210 L310 258 Z" fill="#8b6cad"/>
    <!-- lid slightly open -->
    <path d="M80 200 L350 70 L640 175 L350 160 Z" fill="#2e2848" stroke="#c9a44a" stroke-width="5"/>
    <path d="M80 200 L350 160 L350 70 Z" fill="#3d3658"/>
    <!-- monogram -->
    <circle cx="350" cy="400" r="54" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <text x="350" y="416" text-anchor="middle" font-family="Georgia, serif" font-size="48" fill="#f0d48a">S</text>
  </g>
  <text x="600" y="930" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#f0d48a" letter-spacing="4">CLOSET BUNDLE BOX</text>
  <text x="600" y="970" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#bfc6d8" letter-spacing="3">FIVE TOPS · ONE SHIPPING FEE</text>
</svg>
