services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spocks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-spocks_shop}
    volumes:
      - spocks_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spocks} -d ${POSTGRES_DB:-spocks_shop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-spocks}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-spocks_shop}
    ports:
      - "3000:3000"
    volumes:
      - spocks_media:/var/spocks/media
    command: ["sh", "-c", "npx tsx scripts/migrate.mts && npx tsx scripts/seed.mts && node scripts/ensure-admin.mjs && npm run start"]

volumes:
  spocks_pgdata:
  spocks_media:
